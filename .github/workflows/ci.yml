name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      build: ${{ steps.identity.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias exactas
        run: npm ci
      - name: Auditoría de dependencias de producción
        run: npm audit --omit=dev
      - name: Compilar frontend
        run: npm run build
      - name: Compilar servidor e identificar versión
        run: npm run build:server
      - name: Tests unitarios
        run: npm test
      - name: Migraciones y concurrencia en PostgreSQL aislado
        run: npm run test:reparto:db
      - name: Instalar navegador
        run: npx playwright install --with-deps chromium
      - name: Navegador local con API simulada
        run: npm run test:reparto:browser
      - name: Identidad del código probado
        id: identity
        run: echo "build=$(node scripts/build-info.mjs)" >> "$GITHUB_OUTPUT"
      - name: Construir imagen de producción
        run: docker build -t ctacte-ci:test .
      - name: Imagen sin root, sin red y con SQLite temporal
        env:
          EXPECTED_BUILD: ${{ steps.identity.outputs.build }}
        run: python3 tests/reparto/docker-smoke.py ctacte-ci:test "$EXPECTED_BUILD"
      - name: Evidencia de navegador
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reparto-browser
          path: tests/artifacts-reparto
          if-no-files-found: ignore
          retention-days: 7
  deploy:
    name: Deploy (EasyPanel)
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Disparar un único rebuild
        env:
          DEPLOY_URL: ${{ secrets.EASYPANEL_DEPLOY_URL }}
        run: |
          if [ -z "$DEPLOY_URL" ]; then
            echo "::error::EASYPANEL_DEPLOY_URL no está configurado; no hubo despliegue."
            exit 1
          fi
          curl -fsS --max-time 60 -o /dev/null -X POST "$DEPLOY_URL"
      - name: Verificar versión publicada y esquema listo
        env:
          EXPECTED_BUILD: ${{ needs.build-and-test.outputs.build }}
          # El CDN puede devolver HTML a los runners. Comprobar también el origen con
          # el mismo hostname/certificado; esto no modifica las reglas de Cloudflare.
          REPARTO_DEPLOY_ORIGIN: 72.60.144.175
        run: node scripts/verificar-despliegue.mjs
  lint:
    name: Lint (informativo)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
